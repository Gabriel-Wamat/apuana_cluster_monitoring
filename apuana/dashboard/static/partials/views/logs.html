  <!-- VIEW: LOGS -->
  <div class="view" id="view-logs">
    <div class="sec-title" style="margin-bottom:16px">Job logs</div>
    <div class="logs-folder-bar">
      <button class="icon-btn" id="log-folder-back" type="button" aria-label="Back to previous log folder" title="Back to previous log folder" onclick="openLogBack()" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="icon-btn primary" id="log-folder-list" type="button" aria-label="List log files" title="List log files" onclick="openLogFolderFromInput()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2"/><path d="M3 12A9 9 0 0 1 18.5 5.8"/><path d="M5 18H2v3"/><path d="M19 6h3V3"/></svg>
      </button>
      <div class="field">
        <label for="log-folder-path">Log folder</label>
        <input id="log-folder-path" type="text" placeholder="/home/CIN/&lt;usuario&gt;/logs">
      </div>
    </div>
    <div id="log-file-list" class="log-file-list"></div>
    <div class="logs-grid">
      <div class="log-pane">
        <div class="log-pane-head">
          <label>Stdout path</label>
        </div>
        <input id="log-out-path" type="text" placeholder="/home/user/slurm-12345.out">
        <div class="log-content" id="log-out-content" data-log-kind="out">-- waiting for path --</div>
      </div>
      <div class="log-pane">
        <div class="log-pane-head">
          <label>Stderr path</label>
        </div>
        <input id="log-err-path" type="text" placeholder="/home/user/slurm-12345.err">
        <div class="log-content" id="log-err-content" data-log-kind="err">-- waiting for path --</div>
      </div>
    </div>
    <p style="font-size:11px;color:var(--t3);margin-top:12px"></p>
  </div>
