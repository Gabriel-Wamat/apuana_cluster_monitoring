  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-left">
      <span class="hdr-logo" aria-hidden="true">
        <img src="/static/assets/apuana-logo-transparent.png" alt="">
      </span>
      <span class="hdr-title">
        <h1>Apuana Monitor</h1>
        <p>Cluster - CIn UFPE</p>
      </span>
    </div>
    <div class="hdr-right">
      <span class="chip" id="chip-node">-</span>
      <span class="chip" id="chip-auth">SSH: -</span>
      <span class="chip chip-network" id="chip-network" title="Latência do polling local até o Apuana">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12h3l2-5 4 10 3-7 2 2h4"/>
        </svg>
        <span class="chip-network-label">Net</span>
        <span class="chip-network-value">-</span>
      </span>
      <span class="chip chip-live">Live - 7s</span>
      <button class="btn-refresh" onclick="poll()">&#8635; Refresh</button>
    </div>
  </div>
